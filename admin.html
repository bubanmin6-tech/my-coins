<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #1e222d; color: white; font-family: sans-serif; padding: 20px; }
        .req-card { background: #2a2e39; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 8px 15px; background: #2962ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <h2>⚡ 충전 요청 목록</h2>
    <div id="request-list"></div>

    <script>
        const socket = io();
        socket.emit('admin_getRequests');

        socket.on('admin_updateRequests', (list) => {
            const container = document.getElementById('request-list');
            container.innerHTML = list.length === 0 ? "대기 중인 요청이 없습니다." : "";
            list.forEach(req => {
                const div = document.createElement('div');
                div.className = 'req-card';
                div.innerHTML = `
                    <span><b>${req.id}</b> 님이 500원 충전을 요청했습니다.</span>
                    <button onclick="approve('${req.id}')">승인하기</button>
                `;
                container.appendChild(div);
            });
        });

        function approve(uid) {
            socket.emit('admin_approve', uid);
        }
    </script>
</body>
</html>
