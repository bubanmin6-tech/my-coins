<!DOCTYPE html>
<html>
<head>
    <title>부반민의 코인 서버 관리실</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { cursor: pointer; padding: 8px 15px; border: none; border-radius: 5px; }
        .btn-y { background: #28a745; color: white; }
        .btn-notice { background: #dc3545; color: white; }
        .btn-reset { background: #000; color: white; }
    </style>
</head>
<body>
    <h1>🚀 부반민 관리자 조종실</h1>

    <div class="card">
        <h3>🔌 충전 승인 (기존 y 누르기)</h3>
        <p>충전 요청 목록이 뜨면 승인을 누르세요.</p>
        <div id="recharge-list"></div>
    </div>

    <div class="card">
        <h3>📢 관리자 공지 (notice)</h3>
        <input type="text" id="noticeText" placeholder="공지 내용을 입력하세요">
        <button class="btn-notice" onclick="sendNotice()">공지 전송</button>
    </div>

    <div class="card">
        <h3>🛠️ 자산 강제 수정 (set)</h3>
        <input type="text" id="targetId" placeholder="유저 아이디">
        <input type="number" id="setAmount" placeholder="조정할 금액">
        <button onclick="setAsset()">금액 수정</button>
    </div>

    <div class="card">
        <h3>⚡ 위험 구역</h3>
        <button class="btn-reset" onclick="resetAll()">데이터 전체 초기화 (reset_all)</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // 1. 충전 요청 받기
        socket.on('request_recharge', (data) => {
            const div = document.createElement('div');
            div.innerHTML = `[${data.userId}] 님이 충전 요청함! <button class="btn-y" onclick="approve('${data.userId}')">y(승인)</button>`;
            document.getElementById('recharge-list').appendChild(div);
        });

        function approve(id) {
            socket.emit('admin_command', { type: 'RECHARGE_Y', userId: id });
            alert(id + '님 승인 완료!');
        }

        // 2. 공지사항 (notice)
        function sendNotice() {
            const text = document.getElementById('noticeText').value;
            socket.emit('admin_command', { type: 'NOTICE', value: text });
        }

        // 3. 자산 수정 (set)
        function setAsset() {
            const id = document.getElementById('targetId').value;
            const amount = document.getElementById('setAmount').value;
            socket.emit('admin_command', { type: 'SET_ASSET', userId: id, value: amount });
        }

        // 4. 초기화 (reset_all)
        function resetAll() {
            if(confirm('진짜 다 날릴까요?')) {
                socket.emit('admin_command', { type: 'RESET_ALL' });
            }
        }
    </script>
</body>
</html>
