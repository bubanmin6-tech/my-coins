<script>
    const socket = io();
    const list = document.getElementById('recharge-list');

    // 서버에서 충전 요청 신호를 받았을 때
    socket.on('request_recharge_to_admin', (data) => {
        const item = document.createElement('div');
        item.id = 'req-' + data.userId;
        item.innerHTML = `
            <b>${data.userId}</b> 님이 충전 요청! 
            <button onclick="approve('${data.userId}')" style="background:green;color:white;">y(승인)</button>
        `;
        list.appendChild(item);
    });

    function approve(id) {
        socket.emit('admin_command', { type: 'RECHARGE_Y', userId: id });
        document.getElementById('req-' + id).remove(); // 승인 후 목록에서 삭제
    }

    function resetAll() {
        if(confirm('모든 데이터, 가격, 기록을 초기화할까요?')) {
            socket.emit('admin_command', { type: 'RESET_ALL' });
        }
    }
</script>
