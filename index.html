<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPBIT PRO</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background: #131722; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #notice-bar { background: #2962ff; color: white; padding: 5px; font-size: 13px; overflow: hidden; white-space: nowrap; }
        #notice-text { display: inline-block; animation: marquee 15s linear infinite; }
        @keyframes marquee { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
        header { background: #1e222d; padding: 10px; display: flex; justify-content: space-between; border-bottom: 1px solid #363a45; }
        .main { display: flex; flex: 1; overflow: hidden; }
        #left-panel { flex: 3; display: flex; flex-direction: column; border-right: 1px solid #363a45; }
        #right-panel { flex: 1; display: flex; flex-direction: column; background: #1e222d; }
        #chart-box { flex: 2; position: relative; min-height: 200px; }
        #chat-box { flex: 1; display: flex; flex-direction: column; background: #131722; border-top: 1px solid #363a45; }
        #chat-msgs { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        #chat-input-area { display: flex; padding: 5px; background: #1e222d; }
        .price { font-size: 28px; font-weight: bold; color: #f23645; padding: 5px 10px; }
        .ui-box { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .card { background: #2a2e39; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; }
        button { padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        .b-btn { background: #f23645; } .s-btn { background: #2962ff; }
        input { background: #131722; border: 1px solid #363a45; color: white; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="notice-bar"><span id="notice-text">공지사항 로딩 중...</span></div>
    <header><div style="color:#2962ff; font-weight:bold;">UPBIT PRO</div>
        <div><button id="voice-btn" style="background:#434651; padding:5px 10px; font-size:12px;" onclick="toggleVoice()">🎙 보이스 시작</button> <span id="u-id"></span></div>
    </header>
    <div class="main">
        <div id="left-panel">
            <div id="chart-box">
                <div class="price" id="curr-p">100</div>
                <div id="chart-container" style="width:100%; height:calc(100% - 50px);"></div>
            </div>
            <div id="chat-box">
                <div id="chat-msgs"></div>
                <div id="chat-input-area">
                    <input type="text" id="chat-in" style="flex:1" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) sendChat()">
                    <button onclick="sendChat()" style="background:#2962ff; padding:5px 15px; margin-left:5px;">전송</button>
                </div>
            </div>
        </div>
        <div id="right-panel" class="ui-box">
            <div class="card">
                <div><div style="font-size:11px; color:#848e9c">현금</div><div id="cash">0</div></div>
                <div style="text-align:right;"><div style="font-size:11px; color:#848e9c">코인</div><div id="coin">0</div></div>
            </div>
            <div class="btns" style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                <button class="b-btn" onclick="buy()">매수</button><button class="s-btn" onclick="sell()">매도</button>
            </div>
            <button class="etc-btn" onclick="charge()" style="background:#e2a400">⚡ 충전 요청</button>
            <div id="ranks" style="font-size:11px; background:#2a2e39; padding:10px; border-radius:8px;"></div>
        </div>
    </div>
    <script>
        const socket = io();
        let mid = localStorage.getItem('minId') || "user_" + Math.floor(Math.random()*1000);
        localStorage.setItem('minId', mid);
        document.getElementById('u-id').innerText = mid;

        let chart, series;
        function initChart() {
            if (typeof LightweightCharts === 'undefined') { setTimeout(initChart, 100); return; }
            chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
                layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
                grid: { vertLines: { visible: false }, horzLines: { color: '#2b2b43' } },
                timeScale: { timeVisible: true }
            });
            series = chart.addCandlestickSeries({ upColor: '#f23645', downColor: '#2962ff' });
        }
        initChart();

        socket.emit('join', mid);
        socket.on('init', d => updateUI(d));
        socket.on('updateUI', d => updateUI(d));
        socket.on('updateUI_specific', res => { if(res.userId === mid) updateUI(res.data); });
        socket.on('updateNotice', msg => { document.getElementById('notice-text').innerText = "📢 " + msg; });
        socket.on('chat', d => {
            const div = document.createElement('div');
            div.innerHTML = `<b>${d.id}:</b> ${d.msg}`;
            const box = document.getElementById('chat-msgs');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
        socket.on('tick', d => {
            if(d.price) document.getElementById('curr-p').innerText = d.price.toLocaleString();
            if(d.ranking) document.getElementById('ranks').innerHTML = "🏆 랭킹<br>" + d.ranking.map((u,i)=>`${i+1}. ${u.id}: ${u.total.toLocaleString()}`).join('<br>');
        });
        socket.on('candleUpdate', d => { if(series) { series.setData(d); chart.timeScale().fitContent(); } });

        function updateUI(d) {
            document.getElementById('cash').innerText = d.cash.toLocaleString() + " KRW";
            document.getElementById('coin').innerText = d.coin.toLocaleString() + " BTC";
        }
        function sendChat() { const i = document.getElementById('chat-in'); if(i.value) { socket.emit('chat', i.value); i.value=''; } }
        function buy() { socket.emit('buy', 1); }
        function sell() { socket.emit('sell', 1); }
        function charge() { socket.emit('requestCharge'); }

        let isVoice = false, mediaRecorder;
        async function toggleVoice() {
            if(!isVoice) {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { socket.emit('voice', e.data); };
                mediaRecorder.start(500);
                document.getElementById('voice-btn').innerText = "🎙 보이스 중단";
                document.getElementById('voice-btn').style.background = "#f23645";
                isVoice = true;
            } else {
                mediaRecorder.stop();
                document.getElementById('voice-btn').innerText = "🎙 보이스 시작";
                document.getElementById('voice-btn').style.background = "#434651";
                isVoice = false;
            }
        }
        socket.on('voice', data => {
            const blob = new Blob([data], { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            new Audio(url).play();
        });
    </script>
</body>
</html>
