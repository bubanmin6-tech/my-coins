<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPBIT PRO</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background: #131722; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 12px; background: #1e222d; display: flex; justify-content: space-between; border-bottom: 1px solid #363a45; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .left-content { flex: 2.5; display: flex; flex-direction: column; border-right: 1px solid #363a45; }
        .right-sidebar { flex: 1; display: flex; flex-direction: column; background: #1e222d; padding: 15px; gap: 10px; overflow-y: auto; }
        #chart-container { flex: 1; width: 100%; }
        .chat-area { height: 180px; background: #131722; border-top: 1px solid #363a45; display: flex; flex-direction: column; }
        #chat-log { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        .price-tag { font-size: 30px; font-weight: bold; color: #f23645; padding: 10px; }
        input, button { padding: 10px; border-radius: 4px; border: none; }
        input { background: #2a2e39; color: white; border: 1px solid #363a45; }
        button { cursor: pointer; font-weight: bold; background: #2962ff; color: white; }
    </style>
</head>
<body>
    <header><b>UPBIT PRO</b> <span id="u-id" style="color:#848e9c"></span></header>
    <div class="main-container">
        <div class="left-content">
            <div class="price-tag" id="curr-p">100</div>
            <div id="chart-container"></div>
            <div class="chat-area">
                <div id="chat-log"></div>
                <div style="display:flex; padding:5px; gap:5px;">
                    <input id="chat-in" placeholder="메세지 입력..." style="flex:1" onkeypress="if(event.keyCode==13)sendChat()">
                    <button onclick="sendChat()">전송</button>
                </div>
            </div>
        </div>
        <div class="right-sidebar">
            <div style="background:#2a2e39; padding:12px; border-radius:8px;">
                <div id="cash">현금: 0 KRW</div>
                <div id="coin">코인: 0 BTC</div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                <button style="background:#f23645" onclick="buy()">매수</button>
                <button style="background:#434651" onclick="sell()">매도</button>
            </div>
            <button style="background:#e2a400" onclick="charge()">⚡ 충전 요청</button>
            <div id="ranks" style="font-size:12px; color:#848e9c; margin-top:10px;"></div>
        </div>
    </div>
    <script>
        const socket = io();
        let mid = localStorage.getItem('minId') || "user_" + Math.floor(Math.random()*1000);
        localStorage.setItem('minId', mid);
        document.getElementById('u-id').innerText = mid;

        let chart, series;
        function loadChart() {
            if (typeof LightweightCharts === 'undefined') { setTimeout(loadChart, 300); return; }
            chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
                layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
                grid: { vertLines: { visible: false }, horzLines: { color: '#2b2b43' } },
                timeScale: { timeVisible: true }
            });
            series = chart.addCandlestickSeries({ upColor: '#f23645', downColor: '#2962ff' });
        }
        loadChart();

        socket.emit('join', mid);
        socket.on('init', d => updateUI(d));
        socket.on('updateUI', d => updateUI(d));
        socket.on('updateUI_specific', res => { if(res.userId === mid) updateUI(res.data); });
        socket.on('chat', d => {
            let div = document.createElement('div');
            div.innerHTML = `<b>${d.id}</b>: ${d.msg}`;
            let log = document.getElementById('chat-log');
            log.appendChild(div); log.scrollTop = log.scrollHeight;
        });
        socket.on('tick', d => {
            document.getElementById('curr-p').innerText = d.price.toLocaleString();
            if(d.ranking) document.getElementById('ranks').innerHTML = "🏆 실시간 순위<br>" + d.ranking.map((u,i)=>`${i+1}. ${u.id}: ${u.total}`).join('<br>');
        });
        socket.on('candleUpdate', d => { if(series) series.setData(d); });

        function updateUI(d) {
            document.getElementById('cash').innerText = "현금: " + d.cash.toLocaleString() + " KRW";
            document.getElementById('coin').innerText = "코인: " + d.coin.toLocaleString() + " BTC";
        }
        function sendChat() { let i = document.getElementById('chat-in'); if(i.value){ socket.emit('chat', i.value); i.value=''; } }
        function buy() { socket.emit('buy', 1); }
        function sell() { socket.emit('sell', 1); }
        function charge() { socket.emit('requestCharge'); alert('충전 요청 완료!'); }
        window.addEventListener('resize', () => { if(chart) chart.resize(document.getElementById('chart-container').clientWidth, document.getElementById('chart-container').clientHeight); });
    </script>
</body>
</html>
