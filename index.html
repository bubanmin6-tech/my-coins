<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPBIT PRO</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background: #131722; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        header { background: #1e222d; padding: 10px; display: flex; justify-content: space-between; border-bottom: 1px solid #363a45; font-size: 14px; }
        .main { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
        #chart-box { flex: 3; background: #131722; width: 100%; min-height: 280px; position: relative; }
        .ui-box { flex: 2; background: #1e222d; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; border-top: 1px solid #363a45; }
        .price { font-size: 32px; font-weight: bold; color: #f23645; padding: 5px 10px; }
        .card { background: #2a2e39; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; }
        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        .b-btn { background: #f23645; } .s-btn { background: #2962ff; }
        .etc-btn { background: #434651; padding: 10px; font-size: 12px; }
        input { background: #131722; border: 1px solid #363a45; color: white; padding: 8px; border-radius: 4px; font-size: 14px; }
        @media (min-width: 768px) { .main { flex-direction: row; } .ui-box { flex: 1; border-top: none; border-left: 1px solid #363a45; } }
    </style>
</head>
<body>
    <header>
        <div style="color:#2962ff; font-weight:bold;">UPBIT PRO</div>
        <div id="u-id"></div>
    </header>
    <div class="main">
        <div id="chart-box">
            <div class="price" id="curr-p">100</div>
            <div id="chart" style="width:100%; height:calc(100% - 60px);"></div>
        </div>
        <div class="ui-box">
            <div class="card">
                <div><div style="font-size:11px; color:#848e9c">현금</div><div id="cash" style="font-size:16px;">0 KRW</div></div>
                <div style="text-align:right;"><div style="font-size:11px; color:#848e9c">코인</div><div id="coin" style="font-size:16px;">0 BTC</div></div>
            </div>
            <div class="btns">
                <button class="b-btn" onclick="buy()">매수</button>
                <button class="s-btn" onclick="sell()">매도</button>
            </div>
            <input type="text" id="t-id" placeholder="상대방 ID">
            <input type="number" id="s-amt" placeholder="송금 개수">
            <button class="etc-btn" onclick="send()">송금하기</button>
            <button class="etc-btn" onclick="charge()" style="background:#e2a400">⚡ 500원 충전</button>
            <div id="ranks" style="font-size:11px; background:#2a2e39; padding:10px; border-radius:8px; line-height:1.6;"></div>
        </div>
    </div>
    <script>
        const socket = io();
        let id = localStorage.getItem('minId') || "user_" + Math.floor(Math.random()*1000);
        localStorage.setItem('minId', id);
        document.getElementById('u-id').innerText = id;

        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { visible: false }, horzLines: { color: '#2b2b43' } },
            timeScale: { timeVisible: true, borderVisible: false },
            handleScroll: true, handleScale: true
        });
        const series = chart.addCandlestickSeries({
            upColor: '#f23645', downColor: '#2962ff', borderVisible: false, wickUpColor: '#f23645', wickDownColor: '#2962ff'
        });

        socket.emit('join', id);
        socket.on('init', d => updateUI(d));
        socket.on('updateUI', d => updateUI(d));
        socket.on('updateUI_specific', res => { if(res.userId === id) updateUI(res.data); });
        socket.on('forceReload', () => location.reload());
        socket.on('tick', d => {
            if(d.price) document.getElementById('curr-p').innerText = d.price.toLocaleString();
            if(d.ranking) document.getElementById('ranks').innerHTML = "🏆 실시간 랭킹<br>" + d.ranking.map((u,i)=>`${i+1}. ${u.id}: ${u.total.toLocaleString()}원`).join('<br>');
        });
        socket.on('candleUpdate', d => { 
            series.setData(d);
            chart.timeScale().fitContent();
        });

        function updateUI(d) {
            document.getElementById('cash').innerText = d.cash.toLocaleString() + " KRW";
            document.getElementById('coin').innerText = d.coin.toLocaleString() + " BTC";
        }
        function buy() { socket.emit('buy', 1); }
        function sell() { socket.emit('sell', 1); }
        function charge() { socket.emit('requestCharge'); }
        function send() {
            socket.emit('sendCoin', { to: document.getElementById('t-id').value, amount: document.getElementById('s-amt').value });
        }
        window.onresize = () => chart.resize(document.getElementById('chart').clientWidth, document.getElementById('chart').clientHeight);
    </script>
</body>
</html>
