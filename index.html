<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>UPBIT PRO - 전문 거래소</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background-color: #131722; color: #d1d4dc; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: #1e222d; padding: 10px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #363a45; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        #chart-container { flex: 3; position: relative; background: #131722; }
        .sidebar { flex: 1; display: flex; flex-direction: column; padding: 15px; background-color: #1e222d; gap: 10px; border-left: 1px solid #363a45; overflow-y: auto; }
        .asset-card { background: #2a2e39; padding: 15px; border-radius: 8px; border-left: 4px solid #2962ff; }
        .price-display { font-size: 32px; font-weight: bold; color: #f23645; margin-bottom: 10px; padding-left: 20px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .buy-btn { background-color: #f23645; color: white; }
        .sell-btn { background-color: #2962ff; color: white; }
        .sub-btn { background-color: #434651; color: white; width: 100%; margin-top: 5px; }
        #log-container { flex: 1; background: #131722; padding: 10px; font-size: 12px; border-radius: 4px; overflow-y: auto; color: #848e9c; display: flex; flex-direction: column-reverse; }
        input { background: #131722; border: 1px solid #363a45; color: white; padding: 8px; border-radius: 4px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <header>
        <div style="color:#2962ff; font-weight:bold;">UPBIT PRO</div>
        <div>아이디: <span id="my-id" style="color:white"></span></div>
    </header>

    <div class="main-container">
        <div id="chart-container">
            <div class="price-display" id="current-price">100</div>
            <div id="tv-chart" style="width:100%; height:calc(100% - 60px);"></div>
        </div>

        <div class="sidebar">
            <div class="asset-card">
                <div style="font-size:12px; color:#848e9c">보유 자산</div>
                <div style="font-size:18px;"><span id="my-cash">500</span> KRW</div>
                <div style="font-size:18px;"><span id="my-coin">0</span> BTC</div>
            </div>

            <div class="btn-group">
                <button class="buy-btn" onclick="buyCoin()">매수</button>
                <button class="sell-btn" onclick="sellCoin()">매도</button>
            </div>

            <div style="background:#2a2e39; padding:10px; border-radius:8px;">
                <div style="font-size:12px; margin-bottom:5px;">코인 송금</div>
                <input type="text" id="target-id" style="width:calc(100% - 18px)" placeholder="상대방 ID">
                <input type="number" id="send-amount" style="width:calc(100% - 18px)" placeholder="송금 개수">
                <button class="sub-btn" onclick="sendCoin()">송금하기</button>
            </div>

            <button class="sub-btn" onclick="reqCharge()" style="background:#e2a400">⚡ 충전 요청 (500원)</button>
            <button class="sub-btn" onclick="clearLogs()">🧹 기록 삭제</button>
            
            <div style="background:#2a2e39; padding:10px; border-radius:8px;">
                <div style="font-weight:bold; color:#2962ff; font-size:13px; margin-bottom:5px;">🏆 실시간 랭킹</div>
                <div id="rank-list" style="font-size:12px;"></div>
            </div>

            <div id="log-container"></div>
        </div>
    </div>

    <script>
        const socket = io();
        
        let myId = localStorage.getItem('savedId');
        if (!myId) {
            myId = prompt("사용할 닉네임을 입력하세요") || "user_" + Math.floor(Math.random()*1000);
            localStorage.setItem('savedId', myId);
        }
        document.getElementById('my-id').innerText = myId;

        const chart = LightweightCharts.createChart(document.getElementById('tv-chart'), {
            layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            priceScale: { borderColor: '#485c7b' },
            timeScale: { borderColor: '#485c7b', timeVisible: true }
        });
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#f23645', downColor: '#2962ff', borderDownColor: '#2962ff',
            borderUpColor: '#f23645', wickDownColor: '#2962ff', wickUpColor: '#f23645'
        });

        socket.emit('join', myId);

        socket.on('init', (data) => updateUI(data));
        socket.on('updateUI', (data) => updateUI(data));
        socket.on('updateUI_specific', (res) => { if(res.userId === myId) updateUI(res.data); });

        socket.on('priceUpdate', (data) => {
            document.getElementById('current-price').innerText = data.price.toLocaleString();
        });

        socket.on('candleUpdate', (candles) => {
            candleSeries.setData(candles);
        });

        socket.on('updateRanking', (list) => {
            document.getElementById('rank-list').innerHTML = list.map((u, i) => `
                <div style="display:flex; justify-content:space-between; margin:3px 0; border-bottom:1px solid #363a45;">
                    <span>${i+1}. ${u.id}</span><span>${u.total.toLocaleString()}원</span>
                </div>
            `).join('');
        });

        socket.on('system_msg', (msg) => { addLog(msg); });
        socket.on('adminNotice', (msg) => { alert("📢 공지: " + msg); addLog("공지: " + msg); });
        socket.on('force_reload', () => { location.reload(); });

        function updateUI(data) {
            document.getElementById('my-cash').innerText = data.cash.toLocaleString();
            document.getElementById('my-coin').innerText = data.coin.toLocaleString();
        }

        function buyCoin() { socket.emit('buy', 1); }
        function sellCoin() { socket.emit('sell', 1); }
        function reqCharge() { socket.emit('requestCharge'); addLog("충전 요청을 보냈습니다."); }
        function clearLogs() { document.getElementById('log-container').innerHTML = ''; }
        function sendCoin() {
            const to = document.getElementById('target-id').value;
            const amt = document.getElementById('send-amount').value;
            socket.emit('sendCoin', { toId: to, amount: amt });
        }

        function addLog(msg) {
            const container = document.getElementById('log-container');
            const div = document.createElement('div');
            div.innerText = `> ${msg}`;
            container.prepend(div);
        }
    </script>
</body>
</html>
