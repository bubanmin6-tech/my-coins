<!DOCTYPE html>
<html>
<head>
    <title>부반민의 코인 거래소</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* 민님의 기존 스타일을 그대로 유지하세요 (생략 가능) */
        body { background: #131722; color: white; font-family: sans-serif; }
        #chart { width: 100%; height: 300px; display: flex; align-items: flex-end; gap: 2px; background: #1e222d; padding: 10px; }
        .candle { flex: 1; position: relative; }
        .wick { width: 2px; background: gray; position: absolute; left: 50%; transform: translateX(-50%); }
        .body { width: 100%; position: absolute; }
    </style>
</head>
<body>
    <h1>📈 실시간 코인 시세: <span id="price">100</span>원</h1>
    <h3>내 자산: <span id="cash">500</span>원 | 코인: <span id="coin">0</span>개</h3>
    
    <div id="chart"></div> <button onclick="buy()">매수 (1개)</button>
    <button onclick="sell()">매도 (1개)</button>
    <button onclick="requestRecharge()" style="background:orange;">💰 충전 요청</button>

    <script>
        const socket = io();
        let myId = prompt("아이디를 입력하세요") || "guest";
        socket.emit('join', myId);

        // 1. 돈/코인 업데이트 신호 받기
        socket.on('init', (data) => updateUI(data));
        socket.on('updateUI', (data) => updateUI(data));
        socket.on('updateUI_specific', (res) => {
            if(res.userId === myId) updateUI(res.data);
        });

        function updateUI(data) {
            document.getElementById('cash').innerText = data.cash;
            document.getElementById('coin').innerText = data.coin;
        }

        // 2. 가격 및 차트 업데이트 신호 받기
        socket.on('priceUpdate', (data) => {
            document.getElementById('price').innerText = data.price;
        });

        socket.on('candleUpdate', (candles) => {
            const chart = document.getElementById('chart');
            chart.innerHTML = '';
            candles.forEach(c => {
                const div = document.createElement('div');
                div.className = 'candle';
                const color = c.close >= c.open ? '#f23645' : '#2962ff'; // 상승 빨강, 하락 파랑
                div.innerHTML = `<div class="wick" style="height:${c.high-c.low}px; bottom:${c.low}px;"></div>
                                 <div class="body" style="height:${Math.abs(c.close-c.open)}px; bottom:${Math.min(c.open, c.close)}px; background:${color};"></div>`;
                chart.appendChild(div);
            });
        });

        // 3. 서버 강제 초기화 신호 (reset_all)
        socket.on('force_reload', () => {
            alert('서버 데이터가 초기화되었습니다.');
            location.reload();
        });

        // 4. 공지사항
        socket.on('adminNotice', (msg) => {
            alert('[공지] ' + msg);
        });

        // 기능 함수들
        function buy() { socket.emit('buy', 1); }
        function sell() { socket.emit('sell', 1); }
        function requestRecharge() { 
            socket.emit('requestCharge'); 
            alert('충전 요청을 보냈습니다. 관리자 승인을 기다리세요!');
        }
    </script>
</body>
</html>
