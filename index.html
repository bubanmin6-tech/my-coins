<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPBIT PRO</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background: #131722; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #notice-bar { background: #2962ff; padding: 5px; font-size: 12px; white-space: nowrap; overflow: hidden; }
        #notice-text { display: inline-block; animation: marquee 15s linear infinite; }
        @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
        header { padding: 10px; background: #1e222d; display: flex; justify-content: space-between; border-bottom: 1px solid #363a45; }
        .container { display: flex; flex: 1; overflow: hidden; }
        .chart-section { flex: 2; display: flex; flex-direction: column; border-right: 1px solid #363a45; }
        .side-section { flex: 1; display: flex; flex-direction: column; background: #1e222d; padding: 10px; gap: 10px; overflow-y: auto; }
        #chart-container { flex: 1; width: 100%; position: relative; }
        .chat-area { height: 180px; background: #131722; border-top: 1px solid #363a45; display: flex; flex-direction: column; }
        #chat-msgs { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; color: #d1d4dc; }
        .price { font-size: 28px; font-weight: bold; color: #f23645; padding: 10px; }
        input, button { padding: 10px; border-radius: 4px; border: none; }
        input { background: #2a2e39; color: white; flex: 1; }
        button { cursor: pointer; font-weight: bold; background: #2962ff; color: white; }
        .btn-buy { background: #f23645; }
    </style>
</head>
<body>
    <div id="notice-bar"><span id="notice-text">공지사항 로딩 중...</span></div>
    <header><b>UPBIT PRO</b> <span id="u-id" style="font-size:12px; color:#848e9c"></span></header>
    <div class="container">
        <div class="chart-section">
            <div class="price" id="curr-p">100</div>
            <div id="chart-container"></div>
            <div class="chat-area">
                <div id="chat-msgs"></div>
                <div style="display:flex; padding:5px; gap:5px;">
                    <input id="chat-in" placeholder="채팅을 입력하세요..." onkeypress="if(event.keyCode==13)sendChat()">
                    <button onclick="sendChat()">전송</button>
                </div>
            </div>
        </div>
        <div class="side-section">
            <div style="background:#2a2e39; padding:15px; border-radius:8px;">
                <div id="cash" style="font-size:18px; margin-bottom:5px;">보유: 0 KRW</div>
                <div id="coin" style="font-size:18px;">코인: 0 BTC</div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                <button class="btn-buy" onclick="buy()">매수</button>
                <button onclick="sell()">매도</button>
            </div>
            <button style="background:#e2a400" onclick="charge()">⚡ 충전 요청 (500원)</button>
            <div id="ranks" style="font-size:12px; line-height:1.6; color:#848e9c; margin-top:10px;"></div>
        </div>
    </div>
    <script>
        const socket = io();
        let mid = localStorage.getItem('minId') || "user_" + Math.floor(Math.random()*1000);
        localStorage.setItem('minId', mid);
        document.getElementById('u-id').innerText = "ID: " + mid;

        let chart, series;
        function initChart() {
            if (typeof LightweightCharts === 'undefined') { setTimeout(initChart, 200); return; }
            chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
                layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
                grid: { vertLines: { visible: false }, horzLines: { color: '#2b2b43' } },
                timeScale: { timeVisible: true }
            });
            series = chart.addCandlestickSeries({ upColor: '#f23645', downColor: '#2962ff' });
            window.addEventListener('resize', () => chart.resize(document.getElementById('chart-container').clientWidth, document.getElementById('chart-container').clientHeight));
        }
        initChart();

        socket.emit('join', mid);
        socket.on('init', d => updateUI(d));
        socket.on('updateUI', d => updateUI(d));
        socket.on('updateUI_specific', res => { if(res.userId === mid) updateUI(res.data); });
        socket.on('updateNotice', m => document.getElementById('notice-text').innerText = "📢 " + m);
        socket.on('chat', d => { 
            let div = document.createElement('div'); 
            div.innerHTML = `<span style="color:#2962ff"><b>${d.id}</b></span>: ${d.msg}`; 
            let box = document.getElementById('chat-msgs');
            box.appendChild(div); box.scrollTop = box.scrollHeight;
        });
        socket.on('tick', d => {
            document.getElementById('curr-p').innerText = d.price.toLocaleString();
            document.getElementById('ranks').innerHTML = "🏆 랭킹<br>" + d.ranking.map((u,i)=>`${i+1}. ${u.id}: ${u.total}`).join('<br>');
        });
        socket.on('candleUpdate', d => { if(series) series.setData(d); });

        function updateUI(d) {
            document.getElementById('cash').innerText = "보유: " + d.cash.toLocaleString() + " KRW";
            document.getElementById('coin').innerText = "코인: " + d.coin.toLocaleString() + " BTC";
        }
        function sendChat() { let i = document.getElementById('chat-in'); if(i.value){ socket.emit('chat', i.value); i.value=''; } }
        function buy() { socket.emit('buy', 1); }
        function sell() { socket.emit('sell', 1); }
        function charge() { socket.emit('requestCharge'); alert('충전 요청을 보냈습니다. 관리자 승인을 기다려주세요.'); }
    </script>
</body>
</html>
